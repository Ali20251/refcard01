name: Build, Test & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/refcard01

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t $IMAGE:latest .

      - name: Start container
        run: docker run -d -p 8080:8080 --name refcard01 $IMAGE:latest

      - name: Test website is reachable
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080 > /dev/null; then
              echo "Website is up"
              exit 0
            fi
            sleep 2
          done
          echo "Website did not respond"
          docker logs refcard01
          exit 1

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        run: docker push $IMAGE:latest
